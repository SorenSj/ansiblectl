name: CI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and retain as a workflow artifact
        required: false
        type: string
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python -m tools.validate_docs
      - run: uv run python -m tools.check_architecture
      - run: uv run python -m tools.validate_release
        env:
          GITHUB_REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          GITHUB_REF_NAME: ${{ inputs.release_tag || github.ref_name }}
      - run: uv build
      - run: uv run python -m tools.write_build_metadata
      - run: uv run python -m tools.inspect_release_artifacts
      - name: Upload tagged release artifacts
        if: (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') && matrix.python-version == '3.12'
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: ansiblectl-${{ inputs.release_tag || github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
