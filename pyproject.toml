[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ansiblectl"
version = "0.1.0"
description = "A local-first CLI platform for managing Ansible automation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ansiblectl maintainers" }]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
ansiblectl = "ansiblectl.cli.main:cli"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12.20250822,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ansiblectl"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=ansiblectl --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.coverage.run]
branch = true
source = ["ansiblectl"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
warn_unreachable = true
no_implicit_reexport = true
